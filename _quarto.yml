project:
  type: book
  output-dir: docs

# Configuração de idioma (ESSENCIAL para a hifenização do texto justificado)
lang: pt-BR

book:
  title: "Manutenção e Confiabilidade: Aplicação em R"
  author:
    - name: "Rafael da Silva Fernandes"
      affiliation: "Universidade Federal de Itajubá"
  date: today
  sidebar:
    style: docked
    collapse-level: 3
    search: true
  chapters:
    - index.qmd
    - requirements.qmd
    - setup.qmd
    - part: "Parte I - Medidas de Performance na Mineração"
      chapters:
        - chapters/part1-01-ciclo-carregamento-transporte.qmd
        - chapters/part1-02-analise-dados-recorrentes.qmd
        - chapters/part1-03-aplicacao-pdca.qmd
        - chapters/part1-04-resumo.qmd
        - chapters/part1-05-exercicios.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: flatly   # Tema base limpo
      dark: darkly    # Modo escuro nativo

    css: styles/styles-clean.css

    # --- CONFIGURAÇÃO NATIVA DE FONTE (SEM CSS) ---
    # Usa fontes serifadas do sistema (Georgia, Times) para leitura confortável
    mainfont: "Georgia, serif"

    # Usa fontes sem serifa para títulos (padrão do tema Flatly)
    monofont: "Consolas, monospace"

    # Espaçamento entre linhas (1.5 é o padrão acadêmico/livro)
    linestretch: 1.5

    # Tamanho da fonte base
    fontsize: 1.1em

    code-fold: true
    code-tools: true
    toc: true
    toc-location: right
    number-sections: true
    fig-numbers: true